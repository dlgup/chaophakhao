e.preventDefault();});

var last=0,acc=0;
function frame(ms){
var dt=Math.min((ms-last)/1000,0.1);if(!last)dt=0.016;last=ms;acc+=dt;
var n=0;while(acc>=1/60&&n<4){update(1/60);acc-=1/60;n++;}if(n===4)acc=0;
render(ms/1000);
requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
