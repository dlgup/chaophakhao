if(ptr.id<0){ptr.id=e.pointerId;ptr.lx=p[0];ptr.ly=p[1];ptr.t0=performance.now();ptr.moved=0;try{stage.setPointerCapture(e.pointerId);}catch(x){}}else dropBomb();
e.preventDefault();});
stage.addEventListener('pointermove',function(e){if(e.pointerId!==ptr.id)return;var p=loc(e),mx=p[0]-ptr.lx,my=p[1]-ptr.ly;ptr.lx=p[0];ptr.ly=p[1];ptr.moved+=Math.abs(mx)+Math.abs(my);if(state==='play'&&tm>4.2)setTarget(tx+mx*1.2,ty+my*1.2);});
function pup(e){if(e.pointerId===ptr.id){if(performance.now()-ptr.t0<230&&ptr.moved<14)dropBomb();ptr.id=-1;}}
stage.addEventListener('pointerup',pup);stage.addEventListener('pointercancel',function(e){if(e.pointerId===ptr.id)ptr.id=-1;});
stage.addEventListener('touchend',unlock,{passive:true});stage.addEventListener('click',unlock);
var K={l:0,r:0,u:0,d:0};
window.addEventListener('keydown',function(e){var k=e.key;unlock();
if(k==='ArrowLeft'||k==='a'||k==='A')K.l=1;else if(k==='ArrowRight'||k==='d'||k==='D')K.r=1;else if(k==='ArrowUp'||k==='w'||k==='W')K.u=1;else if(k==='ArrowDown'||k==='s'||k==='S')K.d=1;
else if(k===' '||k==='Enter'||k==='b'||k==='B'){if(!e.repeat){if(state==='title'&&performance.now()-stT>350)goBrief();else if(state==='brief'&&performance.now()-stT>350)startPlay();else if(state==='clear'&&performance.now()-stT>1500){state='title';stT=performance.now();setMood(1);themePlay(true);}else dropBomb();}}
else if(k==='m'||k==='M'){muted=!muted;if(master)master.gain.value=muted?0:0.9;}
else return;e.preventDefault();});
window.addEventListener('keyup',function(e){var k=e.key;if(k==='ArrowLeft'||k==='a'||k==='A')K.l=0;else if(k==='ArrowRight'||k==='d'||k==='D')K.r=0;else if(k==='ArrowUp'||k==='w'||k==='W')K.u=0;else if(k==='ArrowDown'||k==='s'||k==='S')K.d=0;});
setInterval(function(){if(state==='play'&&tm>4.2&&(K.l||K.r||K.u||K.d))setTarget(tx+(K.r-K.l)*14,ty+(K.d-K.u)*14);},16);
window.addEventListener('contextmenu',function(e){e.preventDefault();});document.addEventListener('gesturestart',function(e){e.preventDefault();});
document.addEventListener('visibilitychange',function(){if(document.hidden&&AC)AC.suspend();else if(AC&&state!=='')AC.resume();});
if(DBG){window.__wof={get:function(){return {state:state,tm:tm,score:score,nKill:nKill,nSpawn:nSpawn,T:T.length,night:night,rank:rank};},start:function(){goBrief();startPlay();},brief:goBrief,setTm:function(v){tm=v;},bomb:dropBomb,setPos:function(x,y){px=x;py=y;tx=x;ty=y;},T:T,PA:PA,fx:function(){boom(225,300,2.5);}};}
})();
